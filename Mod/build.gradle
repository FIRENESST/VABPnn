plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.version
group = project.group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            ideConfigGenerated = true
            runDir = "run"
        }
        server {
            ideConfigGenerated = true
            runDir = "run/server"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def properties = [
        version: project.version,
        minecraft_version: project.minecraft_version,
        loader_version: project.loader_version
    ]
    inputs.properties(properties)

    filesMatching("fabric.mod.json") {
        expand(properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named("jar", Jar) {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
// Operators stay in CUDAkernel and are compiled into the same JNI/CUDA DLL.
def cudaOperatorDir = file(providers.gradleProperty("cuda_operator_dir").getOrElse("../CUDAkernel/SelfCudaKernel/SelfCudaKernel"))

// Build and package the Windows JNI/CUDA runtime with static cudart linkage.
tasks.register("buildNative", Exec) {
    group = "build"
    description = "Build the CUDA/OpenGL JNI DLL."
    inputs.files(fileTree("native") { include "capture_bridge.cu", "*.h", "*.ps1" })
    inputs.files(fileTree(cudaOperatorDir) {
        include "**/*.cu", "**/*.cpp", "**/*.cuh", "**/*.h", "**/*.hpp"
        exclude "**/x64/**", "**/Win32/**", "**/Debug/**", "**/Release/**", "**/.vs/**", "**/build/**", "**/obj/**"
    })
    inputs.property("cudaOperatorDirectory", cudaOperatorDir.absolutePath)
    def nativeOutput = layout.buildDirectory.dir("generated/nativeResources/native/windows-x86_64")
    outputs.file(nativeOutput.map { it.file("vabpnn_capture.dll") })
    commandLine("powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass",
        "-File", file("native/build-native.ps1").absolutePath,
        "-OutputDirectory", nativeOutput.get().asFile.absolutePath,
        "-OperatorRoot", cudaOperatorDir.absolutePath)
}
sourceSets.client.resources.srcDir(layout.buildDirectory.dir("generated/nativeResources"))
tasks.named("processClientResources") { dependsOn(tasks.named("buildNative")) }
tasks.named("runClient", JavaExec) {
    systemProperty("vabpnn.scope.enabled",providers.gradleProperty("networkScope").getOrElse("true"))
    systemProperty("vabpnn.cuda.smokeFrames", providers.gradleProperty("gpuSmokeFrames").getOrElse("0"))
    systemProperty("vabpnn.cuda.capacity", providers.systemProperty("vabpnn.cuda.capacity").getOrElse("4"))
}
sourceSets {
    glSmokeTest {
        compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
        runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output
    }
}
tasks.register("glCaptureSmokeTest", JavaExec) {
    group = "verification"
    description = "Check continuous CUDA interop, backpressure, resize and GL state on the NVIDIA GPU."
    dependsOn(tasks.named("glSmokeTestClasses"))
    classpath = sourceSets.glSmokeTest.runtimeClasspath
    mainClass = "cn.vabpnn.mod.client.capture.OpenGlCaptureSmokeTest"
    jvmArgs("--enable-native-access=ALL-UNNAMED")
}

tasks.named("sourcesJar", Jar) {
    dependsOn(tasks.named("buildNative"))
    exclude("**/*.dll", "**/*.lib", "**/*.exp")
    from("native") {
        include("*.cu", "*.h", "*.ps1")
        into("native-src")
    }
    from(cudaOperatorDir) {
        include("**/*.cu", "**/*.cpp", "**/*.cuh", "**/*.h", "**/*.hpp")
        exclude("**/x64/**", "**/Win32/**", "**/Debug/**", "**/Release/**", "**/.vs/**", "**/build/**", "**/obj/**")
        into("operators-src")
    }
}
tasks.named("processClientResources") {
    exclude("**/*.lib", "**/*.exp")
}

tasks.register("scopeUiSmokeTest",JavaExec) {
    group="verification"
    description="Check live scope rendering, inspection coordinates and window lifecycle."
    dependsOn(tasks.named("glSmokeTestClasses"))
    classpath=sourceSets.glSmokeTest.runtimeClasspath
    mainClass="cn.vabpnn.mod.client.scope.ScopeRenderTest"
}

 // Run real Minecraft input tests from a separate test mod and temporary world.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "vabpnn-action-test"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}
tasks.named("runClientGameTest",JavaExec) {
    systemProperty("vabpnn.scope.enabled","false")
    systemProperty("vabpnn.cuda.smokeFrames","0")
}
